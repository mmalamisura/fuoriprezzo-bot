name: fuoriprezzo-bot
on:
  schedule:
    - cron: '0 7,11,17,20 * * *'  # 4 volte al giorno: 9,13,19,22 italiane
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
